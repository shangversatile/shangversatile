name: Daily Quote Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  QUOTE_MAX_TOTAL_SECONDS: "35"
  QUOTE_REQUEST_TIMEOUT_SECONDS: "6"
  QUOTE_MAX_PAGES_PER_RUN: "3"
  QUOTE_ALLOW_FALLBACK_UPDATE: "false"

on:
  schedule:
    - cron: "17 16 * * *"   # UTC 16:17; about California 9:17 AM during daylight saving time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quote-update
  cancel-in-progress: true

jobs:
  update-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          date

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update README quote
        run: timeout 45s python -u scripts/update_quote.py

      - name: Show git diff
        run: git diff -- README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add README.md
            git commit -m "chore: update daily quote [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
