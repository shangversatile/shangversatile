name: Daily Quote Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 16 * * *"   # California 9 AM during daylight saving time; UTC 16:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quote-update
  cancel-in-progress: true

jobs:
  update-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update README quote
        run: python scripts/update_quote.py

      - name: Show git diff
        run: git diff -- README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add README.md
            git commit -m "chore: update daily quote [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
